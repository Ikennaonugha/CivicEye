{% extends "_base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %}Log Out | CivicEye{% endblock title %}

{% block content %}
<!-- ====== Page Banner ====== -->
<section class="ud-page-banner">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <div class="ud-banner-content">
          <h1>Log Out</h1>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ====== Logout Section ====== -->
<section class="ud-login">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <div class="ud-login-wrapper">
          <div class="ud-login-logo">
            <img src="{% static 'images/logo/logo1.svg' %}" alt="CivicEye Logo" />
          </div>

          <div class="text-center mb-4">
            <p class="fs-5">Are you sure you want to log out?</p>
          </div>

          <!-- Logout Form -->
          <form class="ud-login-form" method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}
            
            {% if redirect_field_value %}
              <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}"/>
            {% endif %}
            
            {{ form|crispy }}

            <div class="mt-4">
              <button 
                type="submit" 
                class="ud-main-btn w-100" 
                style="background-color: #dc3545 !important; border-color: #dc3545 !important;"
              >
                Log Out
              </button>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</section>
{% endblock content %}
