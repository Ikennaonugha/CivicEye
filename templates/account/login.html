{% extends "_base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %}Log In | CivicEye{% endblock title %}

{% block content %}
<!-- ====== Page Banner ====== -->
<section class="ud-page-banner">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <div class="ud-banner-content">
          <h1>Log In</h1>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ====== Login Section ====== -->
<section class="ud-login">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <div class="ud-login-wrapper">
          <div class="ud-login-logo">
            <img src="{% static 'images/logo/logo-2.svg' %}" alt="CivicEye Logo" />
          </div>

          <!-- Django Form handled by Crispy Forms -->
          <form class="ud-login-form" method="post">
            {% csrf_token %}
            
            {{ form|crispy }}

            <div class="mt-4">
              <button type="submit" class="ud-main-btn w-100">Log In</button>
            </div>
          </form>

          <!-- Signup Links -->
          <div class="text-center mt-4">
            <p class="signup-option mb-0">
              Not a member yet? <a href="{% url 'account_signup' %}">Sign Up</a>
            </p>
          </div>

        </div>
      </div>
    </div>
  </div>
</section>
{% endblock content %}
